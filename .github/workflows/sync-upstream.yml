name: Sync upstream

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rebase fork onto upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init -q
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags https://github.com/shuaiplus/nodewarden.git refs/heads/main:refs/remotes/upstream/main
          git switch --detach origin/main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains the upstream tip."
            exit 0
          fi

          # Check that replaying commits preserves the full result of a clean merge.
          expected_tree=$(git merge-tree --write-tree HEAD upstream/main)
          original_tip=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rebase --no-fork-point upstream/main

          if [[ $(git rev-parse 'HEAD^{tree}') != "$expected_tree" ]]; then
            echo '::error::Rebase changed the expected file contents. Resolve the sync manually.'
            exit 1
          fi

          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --force-with-lease="refs/heads/main:$original_tip" origin HEAD:refs/heads/main
